<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magu's goon kalender — 2026</title>
<style>
:root{--bg:#090d16;--panel:#121a29;--blue:#00aff0;--ice:#a9e7ff;--gold:#e9c77b;--text:#f5f7fb;--muted:#aab5c8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(ellipse at top,#17304a 0%,#0b1220 42%,#070a11 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#8bdcff 1px,transparent 1px);background-size:75px 75px,113px 113px;background-position:0 0,35px 22px}
main{position:relative;max-width:1100px;margin:auto;padding:34px 18px 60px}
h1{text-align:center;margin:12px 0 8px;font-size:clamp(2rem,6vw,4.4rem);line-height:1.05;letter-spacing:-.04em}
h1 span{color:var(--blue)}
.sub{text-align:center;color:var(--muted);max-width:650px;margin:0 auto 26px;line-height:1.6}
.countdown{text-align:center;margin:0 auto 28px;padding:12px 18px;border:1px solid #27445d;background:#0c1725cc;border-radius:999px;width:fit-content;color:var(--ice);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.door{position:relative;min-height:145px;border:1px solid #2d4c67;border-radius:16px;background:linear-gradient(145deg,#172b43,#0d1726);box-shadow:0 8px 22px #0004;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:transform .18s,border-color .18s,filter .18s;color:white;overflow:hidden}
.door:before{content:"";position:absolute;inset:7px;border:1px solid #ffffff12;border-radius:11px;pointer-events:none}
.door:hover:not(:disabled){transform:translateY(-4px);border-color:var(--blue);filter:brightness(1.12)}
.door:disabled{cursor:not-allowed;filter:saturate(.55);opacity:.72}
.num{font-size:2.2rem;font-weight:800;color:var(--ice);text-shadow:0 0 20px #00aff044}
.door .caption{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.door.opened{background:linear-gradient(145deg,#12364b,#102032);border-color:#00aff0}
.door.opened .num{color:var(--gold)}
.door.today{border-color:var(--gold);box-shadow:0 0 0 1px #e9c77b44,0 8px 25px #0005}
.notice{text-align:center;color:var(--muted);font-size:.85rem;margin-top:20px}
footer{text-align:center;color:#718096;font-size:.78rem;margin-top:35px}
dialog{width:min(680px,calc(100% - 24px));border:1px solid #2c5874;border-radius:20px;background:#0d1725;color:var(--text);padding:0;box-shadow:0 30px 100px #000b}
dialog::backdrop{background:#03060bcc;backdrop-filter:blur(7px)}
.modal-head{padding:22px 24px 14px;background:linear-gradient(120deg,#102b43,#0d1725);border-bottom:1px solid #ffffff12}
.modal-head small{color:var(--blue);letter-spacing:.15em;text-transform:uppercase}
.modal-head h2{margin:6px 0 0;font-size:1.8rem}
.modal-body{padding:22px 24px}
.intro{color:#c4cede;line-height:1.65;white-space:pre-wrap}

.model-link-wrap{display:block;margin:18px 0;text-decoration:none;border-radius:14px;overflow:hidden;border:2px solid #2c5874;transition:transform .2s, border-color .2s}
.model-link-wrap:hover{transform:scale(1.01);border-color:var(--blue)}
.model-img{width:100%;max-height:420px;object-fit:cover;display:block}
.slot{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:15px;border:1px dashed #3c5974;border-radius:12px;background:#101e2e;color:#91a5bb;font-size:.86rem;margin:18px 0}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
button.close{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;background:#243347;color:#e5edf7}
@media(min-width:760px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.door{min-height:155px}}
@media(max-width:420px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.door{min-height:120px}.num{font-size:1.8rem}}
</style>
</head>

  <section class="grid" id="doors" aria-label="Julekalenderens 24 låger"></section>
  <p class="notice">Lågerne åbner efter datoen. Allerede åbnede låger huskes på denne enhed.</p>
  <footer>En privat julekalender til venner · Magu's goon kalender 2026</footer>

</dialog>

const now=new Date();
const year=2026;
const openedKey="creator-advent-opened-2026";
const opened=new Set(JSON.parse(localStorage.getItem(openedKey)||"[]"));
const grid=document.getElementById("doors");
const dialog=document.getElementById("creatorDialog");
const countdown=document.getElementById("countdown");

function dayAvailable(day){
  if (TEST_MODE) return true;
  const unlock=new Date(year,11,day,0,0,0);
  return now>=unlock;
}

function render(){
  grid.innerHTML="";
  for(let day=1;day<=24;day++){
    const btn=document.createElement("button");
    btn.className="door"+(opened.has(day)?" opened":"")+(now.getFullYear()===year&&now.getMonth()===11&&now.getDate()===day?" today":"");
    btn.disabled=!dayAvailable(day);
    btn.innerHTML=`<span class="num">${String(day).padStart(2,"0")}</span><span class="caption">${opened.has(day)?"✦ Åbnet":dayAvailable(day)?"Åbn dagens drop":"🔒 Låst"}</span>`;
    btn.setAttribute("aria-label",`Låge ${day}${btn.disabled?", låst":""}`);
    btn.addEventListener("click",()=>openDoor(day));
    grid.appendChild(btn);
  }
  const start=new Date(year,11,1),end=new Date(year,11,25);
  if (TEST_MODE) {
    countdown.textContent = "Test-tilstand aktiv (alle låger er åbne) 🎁";
  } else {
    if(now<start)countdown.textContent=`Kalenderen åbner om ${Math.ceil((start-now)/86400000)} dage 🎁`;
    else if(now>=end)countdown.textContent="Alle 24 låger er nu åbne ✨";
    else countdown.textContent=`Låge ${now.getDate()} er klar — dagens drop venter 🎁`;
  }
}

function openDoor(day){
  if(!dayAvailable(day))return;
  const creator=creators[day-1];
  opened.add(day);localStorage.setItem(openedKey,JSON.stringify([...opened]));render();
  document.getElementById("doorDate").textContent=`${day}. december · dagens drop`;
  document.getElementById("creatorName").textContent=creator.name;
  document.getElementById("creatorIntro").textContent=creator.intro;
  
  const container = document.getElementById("mediaContainer");
  container.innerHTML = "";

  if (creator.image) {
    const a = document.createElement("a");
    a.className = "model-link-wrap";
    a.href = creator.albumUrl || "#";
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `
      <img src="${creator.image}" alt="${creator.name}" class="model-img">
    `;
    container.appendChild(a);
  } else {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.textContent = "Tilføj billed-link (image) i koden for denne dag";
    container.appendChild(slot);
  }

  dialog.showModal();
}

document.getElementById("closeDialog").addEventListener("click",()=>dialog.close());
render();
